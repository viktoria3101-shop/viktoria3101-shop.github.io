name: Оновлення каталогу з Instagram

on:
  schedule:
    - cron: '17 */3 * * *'   # кожні 3 години
  workflow_dispatch:          # запуск вручну: вкладка Actions → Run workflow
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'js/parser.js'
      - '.github/workflows/sync.yml'

permissions:
  contents: write

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Встановити залежності
        working-directory: scripts
        # npm ci ставить рівно те, що в package-lock.json, і не змінює його
        run: npm ci --no-audit --no-fund

      - name: Забрати пости з Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: '17841464122754980'
        run: node scripts/sync.mjs

      - name: Зберегти зміни на сайті
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Змін немає"
            exit 0
          fi
          git commit -q -m "Оновлення каталогу з Instagram"
          git checkout -- . 2>/dev/null || true   # інші випадкові зміни (не data/) не зберігаємо
          for i in 1 2 3; do
            git pull --rebase --autostash -q && git push -q && exit 0
            git status --short | head -20
            sleep 5
          done
          exit 1
